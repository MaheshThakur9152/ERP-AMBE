services:
  # ============================================================================
  # 1. PostgreSQL Relational Database Service
  # ============================================================================
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_facility}
      POSTGRES_USER: ${POSTGRES_USER:-erp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
      PGDATA: /var/lib/postgresql/data/pgdata
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DR_S3_BUCKET: ${DR_S3_BUCKET:-erp-backups}
      DR_S3_PREFIX: ${DR_S3_PREFIX:-wal}
      ENABLE_WAL_ARCHIVING: ${ENABLE_WAL_ARCHIVING:-true}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be configured in environment}
      AWS_DEFAULT_REGION: us-east-1
      GPG_PASSPHRASE: ${GPG_PASSPHRASE:-}
    volumes:
      - postgres_data_v16:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_admin} -d ${POSTGRES_DB:-erp_facility}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. MinIO S3-Compatible Local Object Storage
  # ============================================================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be configured in environment}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'echo > /dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # 2b. Redis In-Memory Cache (Accelerated Read Layer, GATE-12)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. ERP Backend API Service (Express + TypeScript)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}@postgres:5432/${POSTGRES_DB:-erp_facility}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in environment}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://storage.ambeservice.com}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be configured in environment}
      MINIO_BUCKET: ${MINIO_BUCKET:-ambeuploads}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CLIENT_URL: ${CLIENT_URL:-http://localhost,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://admin.ambeservice.com/api/attendance/google-sheet/callback}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      DRIVE_ATTENDANCE_FOLDER_ID: ${DRIVE_ATTENDANCE_FOLDER_ID:-13-QiXNmxhFrvS3GCzfPU4U_4EcO4VhzS}
      GOOGLE_ATTENDANCE_TEMPLATE_SPREADSHEET_ID: ${GOOGLE_ATTENDANCE_TEMPLATE_SPREADSHEET_ID:-}
      GCP_CLIENT_EMAIL: ${GCP_CLIENT_EMAIL:-}
      GCP_PRIVATE_KEY: ${GCP_PRIVATE_KEY:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
    ports:
      - "5000:5000"
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 4. ERP Frontend Single Page Application (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: erp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - erp_network
    depends_on:
      - backend

  # ============================================================================
  # 5. ERP Automated Backup & Recovery Drills Service
  # ============================================================================
  backup:
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    container_name: erp-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-erp_facility}
      PGUSER: ${POSTGRES_USER:-erp_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured in environment}
      REPLICATION_USER: ${REPLICATION_USER:-erp_replication}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD must be configured in environment}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      DR_S3_BUCKET: ${DR_S3_BUCKET:-erp-backups}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be configured in environment}
      AWS_DEFAULT_REGION: us-east-1
      GPG_PASSPHRASE: ${GPG_PASSPHRASE:?GPG_PASSPHRASE must be configured in environment}
    volumes:
      - backups_data:/backups
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ============================================================================
  # 6. pgAdmin 4 PostgreSQL Web Administration UI (Profile: admin-tools)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: erp-pgadmin
    restart: unless-stopped
    profiles:
      - admin-tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ambeservice.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: ${PGADMIN_CONFIG_SERVER_MODE:-True}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy

# ==============================================================================
# Persistent Named Volumes (Survives container teardown and restarts)
# ==============================================================================
volumes:
  postgres_data_v16:
    name: erp_postgres_data_v16
  postgres_data:
    name: erp_postgres_volume
  minio_data:
    name: erp_minio_volume
  backups_data:
    name: erp_backups_volume
  redis_data:
    name: erp_redis_volume
  pgadmin_data:
    name: erp_pgadmin_data

# ==============================================================================
# Isolated Internal Network
# ==============================================================================
networks:
  erp_network:
    name: erp_internal_network
    driver: bridge

